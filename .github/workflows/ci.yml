name: Multi-OS Clean Venv CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: Build epistemic-guard wheel
        run: uv build --wheel
      - name: Install into isolated clean venv and run lint, typecheck, pytest, and CLI
        shell: bash
        run: |
          uv venv clean-eg-venv --python 3.12
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY_BIN="clean-eg-venv/Scripts/python.exe"
            EG_BIN="clean-eg-venv/Scripts/epistemic-guard.exe"
            LINT_BIN="clean-eg-venv/Scripts/lint-imports.exe"
          else
            PY_BIN="clean-eg-venv/bin/python"
            EG_BIN="clean-eg-venv/bin/epistemic-guard"
            LINT_BIN="clean-eg-venv/bin/lint-imports"
          fi
          uv pip install --python "$PY_BIN" dist/epistemic_guard-*.whl pytest import-linter ruff mypy
          "$PY_BIN" -m ruff check src tests
          "$PY_BIN" -m mypy --strict src/epistemic_guard
          "$PY_BIN" -m pytest -c pyproject.toml tests -v
          "$EG_BIN" demo
          "$EG_BIN" doctor
          "$LINT_BIN"
