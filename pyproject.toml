[project]
name = "epistemic-guard"
version = "0.6.7"
description = "Signed tool receipts, stdio & Streamable HTTP MCP proxies, Ed25519 memory write-gating, and CPU/NPU agent verification (zero LLM calls)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sean Maxwell" }]
requires-python = ">=3.10"
keywords = [
    "agents",
    "ai-security",
    "ed25519",
    "guardrails",
    "hallucination-detection",
    "litellm",
    "mcp",
    "mcp-proxy",
    "merkle-tree",
    "model-context-protocol",
    "opentelemetry",
    "openvino",
    "provenance",
    "rag",
    "runtime-verification",
    "tool-calling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "openvino>=2025.0.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "import-linter>=2.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
epistemic-guard = "epistemic_guard.cli:main"

[project.urls]
Homepage = "https://github.com/AlienatedAliens/epistemic-guard"
Repository = "https://github.com/AlienatedAliens/epistemic-guard"
Issues = "https://github.com/AlienatedAliens/epistemic-guard/issues"
Models = "https://huggingface.co/RollSolo/epistemic-guard-int8"
Benchmarks = "https://huggingface.co/datasets/RollSolo/epistemic-guard-benchmarks"
Demo = "https://huggingface.co/spaces/RollSolo/epistemic-guard"
"Author ORCID" = "https://orcid.org/0009-0004-0133-0463"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/AGENTS.md",
    "/LICENSE",
    "/MODEL_NOTICES.md",
    "/README.md",
    "/llms.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "S", "UP", "ANN", "PL"]
ignore = ["PLR0913", "PLR2004", "S105", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "S311", "S324", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S102", "S106", "S603", "S607", "S608", "ANN", "PLR", "BLE001", "PLC0415", "E501"]
"src/epistemic_guard/mcp_proxy.py" = ["S603"]
"src/epistemic_guard/http_proxy.py" = ["S310"]
"src/epistemic_guard/models.py" = ["S310"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["openvino.*", "tokenizers.*"]
ignore_missing_imports = true
